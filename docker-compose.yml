version: '3.8'

services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: realestate_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend/dist:/var/www/frontend:ro
      - uploads_data:/var/www/uploads:ro
    depends_on:
      - backend

  # Asosiy Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: realestate_backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://crm_user:${DB_PASSWORD:-crm_secret_2026}@postgres:5432/realestate_crm?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret_2026}@redis:6379
      - JWT_SECRET=${JWT_SECRET:-jwt_production_secret_32chars_key}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME:-realtor_crm_bot}
      - ESKIZ_EMAIL=${ESKIZ_EMAIL:-}
      - ESKIZ_PASSWORD=${ESKIZ_PASSWORD:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - postgres
      - redis

  # Matching & SMS Background Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: realestate_worker
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://crm_user:${DB_PASSWORD:-crm_secret_2026}@postgres:5432/realestate_crm?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret_2026}@redis:6379
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - ESKIZ_EMAIL=${ESKIZ_EMAIL:-}
      - ESKIZ_PASSWORD=${ESKIZ_PASSWORD:-}
    depends_on:
      - postgres
      - redis

  # PostgreSQL DB
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: realestate_postgres
    restart: always
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-crm_secret_2026}
      POSTGRES_DB: realestate_crm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  # Redis
  redis:
    image: redis:7-alpine
    container_name: realestate_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis_secret_2026}"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres_data:
  redis_data:
  uploads_data:
